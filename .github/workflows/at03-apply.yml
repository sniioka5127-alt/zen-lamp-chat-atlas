name: AT-03 Apply Project Binding Integration

on:
  push:
    branches:
      - at-03-project-binding

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply AT-03 browser integration migration
        run: node scripts/apply-at03-project-binding.mjs
      - name: Commit generated integration changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No integration changes to commit."
          else
            git commit -m "AT-03: integrate Human Project binding into browser runtime"
            git push origin HEAD:at-03-project-binding
          fi
