name: Chat Atlas AT-02

on:
  push:
    branches:
      - at-02-browser-runtime
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  browser-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply AT-02 index integration
        run: node scripts/apply-at02-index.mjs
      - name: Run AT-01 and AT-02 tests
        run: node --test tests/chat-atlas-at01.test.mjs tests/chat-atlas-at02-browser.test.mjs
      - name: Verify integrated index
        run: node scripts/verify-at02-index.mjs
      - name: Commit generated index on feature branch
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html already integrated"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "AT-02: integrate ContextItem producer into browser UI"
          git push
