name: Chat Atlas AT-01..AT-03

on:
  push:
    branches:
      - main
      - at-02-browser-runtime
      - at-03-project-binding
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  browser-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run AT-01 through AT-03 tests
        run: node --test tests/chat-atlas-at01.test.mjs tests/chat-atlas-at02-browser.test.mjs tests/chat-atlas-at03-project-binding.test.mjs
      - name: Verify integrated index
        run: node scripts/verify-at02-index.mjs
